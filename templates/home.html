<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>DigiSPES</title>
    <link rel="icon" href="/static/images/spes-logo.png" type="image/png" />
    <!-- bs for modal -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Baloo+2&family=Poppins&display=swap");
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(
          to bottom,
          #f7fbff 0%,
          #a9d2f9 50%,
          #a9d2f9 80%,
          #f7fbff 100%
        );
      }
      /* navbar no backgorund color, transparent instead */
      nav {
        background-color: transparent;
        box-shadow: none;
      }
      .navbar-nav .nav-link {
        font-weight: 500;
        font-size: 14px;
        color: #b0b0b0;
        text-transform: uppercase;
        padding: 0 10px;
      }
      .navbar-nav .nav-link.active {
        color: #000;
        border-bottom: 2px solid #0d6efd;
      }
      .btn-contact {
        background-color: #3a5ea8;
        color: white;
        border-radius: 30px;
        padding: 8px 20px;
        font-size: 12px;
        font-weight: 500;
        box-shadow: 3px 3px 8px rgb(0 0 0 / 0.15);
        border: none;
        position: relative;
        z-index: 1;
      }
      .welcome-section {
        min-height: calc(100vh - 72px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 30px;
      }
      .welcome-text {
        max-width: 480px;
        color: #2a7bbd;
      }
      .welcome-text h1 {
        font-family: "Baloo 2", cursive;
        font-weight: 700;
        font-size: 72px;
        line-height: 1.1;
        margin-bottom: 20px;
      }
      .welcome-text p {
        font-size: 16px;
        color: white;
        max-width: 480px;
        margin-bottom: 40px;
      }
      .btn-newapp {
        font-family: "Poppins", sans-serif;
        font-weight: 400;
        font-size: 14px;
        border-radius: 30px;
        padding: 8px 20px;
        box-shadow: 3px 3px 8px rgb(0 0 0 / 0.15);
        border: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn-newapp.primary {
        background-color: #6fc6ff;
        color: white;
      }
      .btn-newapp.primary i {
        font-size: 18px;
      }
      .btn-newapp.secondary {
        background-color: #cfcfcf;
        color: #9a9a9a;
      }
      .btn-newapp.secondary i {
        font-size: 18px;
      }
      .logo-container {
        max-width: 360px;
        margin-left: 40px;
      }
      @media (max-width: 991.98px) {
        .welcome-section {
          flex-direction: column;
          text-align: center;
          padding: 30px 20px;
        }
        .welcome-text {
          max-width: 100%;
          margin-bottom: 40px;
          color: #2a7bbd;
        }
        .welcome-text p {
          color: white;
        }
        .logo-container {
          margin-left: 0;
          max-width: 280px;
        }
      }
      @media (max-width: 575.98px) {
        .welcome-text h1 {
          font-size: 48px;
        }
        .btn-contact {
          font-size: 14px;
          padding: 6px 16px;
        }
        .btn-contact .btn-icon {
          width: 30px;
          height: 30px;
          right: -15px;
        }
      }
      .welcome-to {
        font-size: 3rem;
        font-weight: 700;
        color: #2a7bbd;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg py-3 px-4">
      <div class="container-fluid justify-content-end gap-2">
        <ul class="navbar-nav me-3 gap-3">
          <li class="nav-item">
            <a class="nav-link active" href="#"> HOME </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"> ABOUT </a>
          </li>
        </ul>
        <button
          class="btn btn-contact d-flex align-items-center"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#loginModal"
        >
          LOGIN
        </button>

        <!-- Account Modal with Tabs -->
        <div
          class="modal fade"
          id="accountModal"
          tabindex="-1"
          aria-labelledby="accountModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="accountModalLabel">Account</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <ul class="nav nav-tabs" id="accountTab" role="tablist">
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link active"
                      id="login-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#login"
                      type="button"
                      role="tab"
                      aria-controls="login"
                      aria-selected="true"
                    >
                      Login
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link"
                      id="register-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#register"
                      type="button"
                      role="tab"
                      aria-controls="register"
                      aria-selected="false"
                    >
                      Register
                    </button>
                  </li>
                </ul>
                <div class="tab-content mt-3" id="accountTabContent">
                  <!-- Login Tab -->
                  <div
                    class="tab-pane fade show active"
                    id="login"
                    role="tabpanel"
                    aria-labelledby="login-tab"
                  >
                    <form>
                      <div class="form-floating mb-3">
                        <input
                          type="email"
                          class="form-control"
                          id="email"
                          placeholder="Enter your email"
                        />
                        <label for="email">Email address</label>
                      </div>
                      <div class="form-floating mb-3 position-relative">
                        <input
                          type="password"
                          class="form-control"
                          id="password"
                          placeholder="Enter your password"
                        />
                        <label for="password">Password</label>
                        <i
                          class="fas fa-eye position-absolute"
                          style="
                            top: 50%;
                            right: 10px;
                            transform: translateY(-50%);
                            cursor: pointer;
                          "
                          onclick="togglePasswordVisibility('password', this)"
                        ></i>
                      </div>
                      <button type="submit" class="btn btn-primary w-100">
                        Login
                      </button>
                    </form>
                  </div>
                  <!-- Register Tab -->
                  <div
                    class="tab-pane fade"
                    id="register"
                    role="tabpanel"
                    aria-labelledby="register-tab"
                  >
                    <form>
                      <div class="form-floating mb-3">
                        <select
                          class="form-select"
                          id="applicantType"
                          aria-label="Applicant Type"
                        >
                          <option selected>Select Applicant Type</option>
                          <option value="new">New Applicant</option>
                          <option value="old">Old Applicant</option>
                        </select>
                        <label for="applicantType">Applicant Type</label>
                      </div>
                      <div class="form-floating mb-3">
                        <input
                          type="text"
                          class="form-control"
                          id="username"
                          placeholder="Enter your username"
                        />
                        <label for="username">Username</label>
                      </div>
                      <div class="form-floating mb-3 position-relative">
                        <input
                          type="password"
                          class="form-control"
                          id="passwordRegister"
                          placeholder="Enter your password"
                        />
                        <label for="passwordRegister">Password</label>
                        <i
                          class="fas fa-eye position-absolute"
                          style="
                            top: 50%;
                            right: 10px;
                            transform: translateY(-50%);
                            cursor: pointer;
                          "
                          onclick="togglePasswordVisibility('passwordRegister', this)"
                        ></i>
                      </div>
                      <div class="form-floating mb-3 position-relative">
                        <input
                          type="password"
                          class="form-control"
                          id="confirmPassword"
                          placeholder="Confirm your password"
                        />
                        <label for="confirmPassword">Confirm Password</label>
                        <i
                          class="fas fa-eye position-absolute"
                          style="
                            top: 50%;
                            right: 10px;
                            transform: translateY(-50%);
                            cursor: pointer;
                          "
                          onclick="togglePasswordVisibility('confirmPassword', this)"
                        ></i>
                      </div>
                      <a
                        href="{{ url_for('new_applicants_dashboard') }}"
                        class="btn btn-primary w-100"
                      >
                        Register
                      </a>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- login -->
        <div
          class="modal fade"
          id="loginModal"
          tabindex="-1"
          aria-labelledby="loginModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">Login</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form>
                  <div class="form-floating mb-3">
                    <input
                      type="text"
                      class="form-control"
                      id="usernameLogin"
                      placeholder="Enter your username"
                    />
                    <label for="usernameLogin">Username</label>
                  </div>
                  <div class="form-floating mb-3 position-relative">
                    <input
                      type="password"
                      class="form-control"
                      id="passwordLogin"
                      placeholder="Enter your password"
                    />
                    <label for="passwordLogin">Password</label>
                    <i
                      class="fas fa-eye position-absolute"
                      style="
                        top: 50%;
                        right: 10px;
                        transform: translateY(-50%);
                        cursor: pointer;
                      "
                      onclick="togglePasswordVisibility('passwordLogin', this)"
                    ></i>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 mb-3">
                    Login
                  </button>
                </form>
                <p class="text-center">
                  Applicants?
                  <a
                    href="javascript(void)"
                    data-bs-target="#accountModal"
                    data-bs-toggle="modal"
                  >
                    Apply here</a
                  >
                </p>
              </div>
            </div>
          </div>
        </div>

        <script>
          function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
              input.type = "text";
              icon.classList.remove("fa-eye");
              icon.classList.add("fa-eye-slash");
            } else {
              input.type = "password";
              icon.classList.remove("fa-eye-slash");
              icon.classList.add("fa-eye");
            }
          }
        </script>
        <!--  -->
      </div>
    </nav>
    <section class="welcome-section d-flex container gap-5">
      <div class="welcome-text">
        <h1 class="bold">
          <span class="welcome-to">Welcome to</span>
          <br />
          <span
            style="
              font-size: 7rem;
              font-family: 'Times New Roman', Times, serif;
            "
            >DigiSPES</span
          >
        </h1>
        <p>
          DigiSPES is a web-based platform for the Special Program for the
          Employment of Students, making it easier to apply, track your status,
          receive updates, and connect with PESO — all in one place.
        </p>
        <div class="d-flex gap-3 flex-wrap">
          <button
            class="btn btn-newapp primary"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#accountModal"
          >
            Apply Now
            <i class="fas fa-arrow-right"> </i>
          </button>
          <!-- <button
            class="btn btn-newapp secondary"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#loginModal"
          >
            Old Applicants
            <i class="fas fa-arrow-right"> </i>
          </button> -->
        </div>
      </div>
      <div
        class="logo-container d-flex align-items-center justify-content-center"
      >
        <img
          alt="spes-logo"
          class="img-fluid"
          height="360"
          src="/static/images/hero-logo.png"
          width="360"
        />
      </div>
    </section>
    <!-- script for bs modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
